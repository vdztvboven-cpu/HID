<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DuckyScript to CH552 Converter (SDCC Compatible)</title>
<style>
:root{--bg:#f3f1ec;--panel:#fff;--ink:#1d2320;--mute:#5d665f;--line:#cfd3cb;--acc:#0b6b4f;--accink:#fff;--warn:#9a5b00;--code:#0f1a14;--codeink:#cdeed9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141916;--panel:#1c231f;--ink:#e6ece7;--mute:#9aa69d;--line:#2f3a33;--acc:#4cc38f;--accink:#06251a;--warn:#e0a24a;--code:#0c110e;--codeink:#cdeed9}}
:root[data-theme="dark"]{--bg:#141916;--panel:#1c231f;--ink:#e6ece7;--mute:#9aa69d;--line:#2f3a33;--acc:#4cc38f;--accink:#06251a;--warn:#e0a24a;--code:#0c110e;--codeink:#cdeed9}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 16px;max-width:70ch}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;min-width:0}
label{font-weight:600;margin-bottom:6px;font-size:.95rem}
textarea{width:100%;min-height:360px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:12px;font:13px/1.5 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;tab-size:2;white-space:pre;overflow:auto}
#in{background:var(--panel);color:var(--ink)}
#out{background:var(--code);color:var(--codeink)}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bar{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
button{background:var(--acc);color:var(--accink);border:0;border-radius:6px;padding:9px 16px;font:600 .95rem inherit;font-family:inherit;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
#msg{color:var(--mute);font-size:.9rem}
.settings-panel{display:flex;gap:15px;align-items:center;margin-bottom:14px;flex-wrap:wrap;background:var(--panel);padding:12px 14px;border:1px solid var(--line);border-radius:6px}
.settings-panel div{display:flex;flex-direction:column;font-size:.85rem}
.settings-panel select, .settings-panel input{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font:inherit;font-size:.9rem;width:120px}
#warn{margin:14px 0 0;padding:0;list-style:none;color:var(--warn);font-size:.92rem}
.note{margin-top:18px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:.92rem;color:var(--mute)}
.note b{color:var(--ink)}
</style>
</head>
<body>
<main>
<h1>DuckyScript to CH552 Converter</h1>
<p class="sub">Convert DuckyScript to optimized bytecode arrays for the CH552p.</p>

<div class="settings-panel">
  <div>
    <label for="lay">Keyboard Layout:</label>
    <select id="lay">
      <option value="us">US QWERTY</option>
      <option value="az">Belgian AZERTY</option>
    </select>
  </div>
  <div>
    <label for="keyDelay">Key Delay (ms):</label>
    <input type="number" id="keyDelay" value="2" min="1" max="100">
  </div>
  <div>
    <label for="bootDelay">Boot Delay (ms):</label>
    <input type="number" id="bootDelay" value="500" min="0" max="10000">
  </div>
</div>

<div class="grid">
<div class="col"><label for="in">DuckyScript</label>
<textarea id="in" spellcheck="false">REM Rickroll Payload
DEFAULT_DELAY 20
DELAY 1000
GUI r
DELAY 500
STRING https://www.youtube.com/watch?v=dQw4w9WgXcQ
ENTER</textarea></div>
<div class="col"><label for="out">Arduino Sketch (.ino)</label>
<textarea id="out" spellcheck="false" readonly></textarea></div>
</div>
<div class="bar"><button id="copy">Copy sketch</button><button id="sel" class="alt">Select all</button><span id="msg"></span></div>
<ul id="warn"></ul>
<div class="note"><b>Important:</b> In Arduino IDE, set <i>Tools → USB Settings</i> to <b>USER CODE w/ 148B USB ram</b>.</div>
</main>
<script>
var MODS = {
  CTRL: 0x01, CONTROL: 0x01, SHIFT: 0x02, ALT: 0x04, GUI: 0x08, WINDOWS: 0x08, COMMAND: 0x08,
  RCTRL: 0x10, RIGHTCTRL: 0x10, RSHIFT: 0x20, RIGHTSHIFT: 0x20, RALT: 0x40, RIGHTALT: 0x40
};

var KEYS = {
  ENTER: 'KEY_RETURN', RETURN: 'KEY_RETURN', ESC: 'KEY_ESC', ESCAPE: 'KEY_ESC',
  BACKSPACE: 'KEY_BACKSPACE', TAB: 'KEY_TAB', SPACE: "' '",
  CAPSLOCK: 'KEY_CAPS_LOCK', PRINTSCREEN: 'KEY_PRINT_SCREEN', SCROLLLOCK: 'KEY_SCROLL_LOCK',
  PAUSE: 'KEY_PAUSE', INSERT: 'KEY_INSERT', HOME: 'KEY_HOME', PAGEUP: 'KEY_PAGE_UP',
  DELETE: 'KEY_DELETE', DEL: 'KEY_DELETE', END: 'KEY_END', PAGEDOWN: 'KEY_PAGE_DOWN',
  RIGHT: 'KEY_RIGHT_ARROW', RIGHTARROW: 'KEY_RIGHT_ARROW', LEFT: 'KEY_LEFT_ARROW', LEFTARROW: 'KEY_LEFT_ARROW',
  DOWN: 'KEY_DOWN_ARROW', DOWNARROW: 'KEY_DOWN_ARROW', UP: 'KEY_UP_ARROW', UPARROW: 'KEY_UP_ARROW', MENU: 'KEY_MENU'
};

var AZ = {};
(function(){
  var s = {a:'q', q:'a', z:'w', w:'z', m:';'};
  'abcdefghijklmnopqrstuvwxyz'.split('').forEach(function(c){var k = s[c]||c; AZ[c] = [k, 0]; AZ[c.toUpperCase()] = [k, 1];});
  '0123456789'.split('').forEach(function(d){AZ[d] = [d, 1];});
  [['&','1',0],['"','3',0],["'",'4',0],['(','5',0],['!','8',0],[')','-',0],['-','=',0],['_','=',1],['$',']',0],['*',']',1],['%',"'",1],[',','m',0],['?','m',1],[';',',',0],['.',',',1],[':','.',0],['/','.',1],['=','/',0],['+','/',1],['|','1',2],['@','2',2],['#','3',2],['^','6',2],['{','9',2],['}','0',2],['[','[',2],[']',']',2],['`','\\',2],['~','/',2],[' ',' ',0]].forEach(function(r){AZ[r[0]] = [r[1], r[2]];});
})();

function hex(n) { return '0x' + ('0' + n.toString(16)).slice(-2).toUpperCase(); }

function convert(src){
  var layout = document.getElementById('lay').value;
  var mods = [], keys = [], warn = [], defaultDelay = 0;
  var lines = src.split(/\r?\n/);
  var lastCount = 0;

  lines.forEach(function(raw, i){
    var line = raw.replace(/^\s+/,'');
    if (!line.trim()) return;
    var m = line.match(/^(\S+)(?: (.*))?$/), cmd = m[1].toUpperCase(), arg = m[2] || '', n = i + 1;

    if (cmd === 'REM') return;

    if (cmd === 'DEFAULT_DELAY' || cmd === 'DEFAULTDELAY') {
      defaultDelay = parseInt(arg, 10) || 0;
      return;
    }

    var itemMods = [], itemKeys = [];

    if (cmd === 'DELAY') {
      var d = parseInt(arg, 10) || 0;
      while (d > 0) {
        var chunk = Math.min(d, 255);
        itemMods.push(0xFE);
        itemKeys.push(hex(chunk));
        d -= chunk;
      }
    } else if (cmd === 'REPEAT') {
      var count = parseInt(arg, 10) || 1;
      if (lastCount === 0) {
        warn.push('Line ' + n + ': REPEAT has no prior action to repeat');
      } else {
        var startIdx = mods.length - lastCount;
        var sliceM = mods.slice(startIdx);
        var sliceK = keys.slice(startIdx);
        for (var r = 0; r < count; r++) {
          for (var c = 0; c < sliceM.length; c++) {
            mods.push(sliceM[c]);
            keys.push(sliceK[c]);
          }
          if (defaultDelay > 0) {
            mods.push(0xFE);
            keys.push(hex(Math.min(defaultDelay, 255)));
          }
        }
      }
      return;
    } else if (cmd === 'STRING' || cmd === 'STRINGLN') {
      var clean = arg.replace(/[^\x20-\x7e]/g, '');
      for (var j = 0; j < clean.length; j++) {
        var ch = clean[j];
        if (layout === 'az') {
          var a = AZ[ch];
          if (!a) { warn.push('Line ' + n + ': AZERTY cannot type character "' + ch + '"'); continue; }
          var mod = a[1] === 1 ? 0x02 : (a[1] === 2 ? 0x40 : 0x00);
          var kVal = "'" + (a[0] === '\'' ? "\\'" : (a[0] === '\\' ? "\\\\" : a[0])) + "'";
          itemMods.push(mod);
          itemKeys.push(kVal);
        } else {
          var kVal = "'" + (ch === '\'' ? "\\'" : (ch === '\\' ? "\\\\" : ch)) + "'";
          itemMods.push(0x00);
          itemKeys.push(kVal);
        }
      }
      if (cmd === 'STRINGLN') {
        itemMods.push(0x00);
        itemKeys.push('KEY_RETURN');
      }
    } else {
      var parts = line.trim().split(/\s+/);
      var repeatCount = 1;
      if (parts.length > 1 && !isNaN(parts[parts.length - 1])) {
        repeatCount = parseInt(parts[parts.length - 1], 10) || 1;
        parts.pop();
      }

      var comboMod = 0, comboKey = 0;
      parts.forEach(function(tok){
        var u = tok.toUpperCase();
        if (MODS[u]) comboMod |= MODS[u];
        else if (KEYS[u]) comboKey = KEYS[u];
        else if (/^F([1-9]|1[0-2])$/.test(u)) {
          comboKey = 'KEY_' + u;
        } else if (tok.length === 1 && /[a-zA-Z0-9]/.test(tok)) {
          if (layout === 'az' && AZ[tok]) {
            comboKey = "'" + AZ[tok][0] + "'";
            if (AZ[tok][1] === 1) comboMod |= 0x02;
            if (AZ[tok][1] === 2) comboMod |= 0x40;
          } else {
            comboKey = "'" + tok.toLowerCase() + "'";
            if (tok >= 'A' && tok <= 'Z') comboMod |= 0x02;
          }
        } else {
          warn.push('Line ' + n + ': unknown key "' + tok + '"');
        }
      });

      if (comboKey || comboMod) {
        for (var rc = 0; rc < repeatCount; rc++) {
          itemMods.push(comboMod);
          itemKeys.push(comboKey || 0x00);
        }
      }
    }

    if (itemMods.length > 0) {
      for (var a = 0; a < itemMods.length; a++) {
        mods.push(itemMods[a]);
        keys.push(itemKeys[a]);
      }
      lastCount = itemMods.length;
      if (defaultDelay > 0) {
        mods.push(0xFE);
        keys.push(hex(Math.min(defaultDelay, 255)));
        lastCount += 1;
      }
    }
  });

  var keyDelay = parseInt(document.getElementById('keyDelay').value, 10) || 15;
  var bootDelay = parseInt(document.getElementById('bootDelay').value, 10) || 3000;

  var ino = [
'// SDCC Safe Bytecode Payload for CH552 (ch55xduino)',
'// Target layout: ' + (layout === 'az' ? 'Belgian AZERTY' : 'US QWERTY'),
'// Tools -> USB Settings -> USER CODE w/ 148B USB ram',
'#ifndef USER_USB_RAM',
'#error "Select Tools -> USB Settings -> USER CODE w/ 148B USB ram"',
'#endif',
'#include "src/userUsbHidKeyboard/USBHIDKeyboard.h"',
'',
'__code const uint8_t PAYLOAD_MODS[] = { ' + mods.join(', ') + ' };',
'__code const uint16_t PAYLOAD_KEYS[] = { ' + keys.join(', ') + ' };',
'',
'void runPayload() {',
'  uint16_t len = sizeof(PAYLOAD_MODS);',
'  for (uint16_t i = 0; i < len; i++) {',
'    uint8_t mod = PAYLOAD_MODS[i];',
'    uint16_t key = PAYLOAD_KEYS[i];',
'    if (mod == 0xFE) {',
'      delay((uint8_t)key);',
'    } else {',
'      if (mod & 0x01) Keyboard_press(KEY_LEFT_CTRL);',
'      if (mod & 0x02) Keyboard_press(KEY_LEFT_SHIFT);',
'      if (mod & 0x04) Keyboard_press(KEY_LEFT_ALT);',
'      if (mod & 0x08) Keyboard_press(KEY_LEFT_GUI);',
'      if (mod & 0x10) Keyboard_press(KEY_RIGHT_CTRL);',
'      if (mod & 0x20) Keyboard_press(KEY_RIGHT_SHIFT);',
'      if (mod & 0x40) Keyboard_press(KEY_RIGHT_ALT);',
'      if (key) {',
'        if (mod == 0x00 && key < 0x80) {',
'          Keyboard_write((char)key);',
'        } else {',
'          Keyboard_press((uint8_t)key);',
'        }',
'      }',
'      delay(' + keyDelay + ');',
'      Keyboard_releaseAll();',
'      delay(' + keyDelay + ');',
'    }',
'  }',
'}',
'',
'void setup() {',
'  USBInit();',
'  delay(' + bootDelay + ');',
'  runPayload();',
'}',
'',
'void loop() {}'
  ].join('\n');

  return { text: ino, warn: warn };
}

var inp = document.getElementById('in'), out = document.getElementById('out'), wl = document.getElementById('warn'), msg = document.getElementById('msg'), lay = document.getElementById('lay');
var keyDelayInp = document.getElementById('keyDelay'), bootDelayInp = document.getElementById('bootDelay');

function run(){
  var r = convert(inp.value);
  out.value = r.text;
  wl.innerHTML = '';
  r.warn.forEach(function(w){var li=document.createElement('li');li.textContent=w;wl.appendChild(li)});
}
function flash(t){msg.textContent=t;setTimeout(function(){msg.textContent=''},2000)}
function selectOut(){out.focus();out.select()}
document.getElementById('sel').onclick = selectOut;
document.getElementById('copy').onclick = function(){
  selectOut();
  var ok = false;
  try{ok = document.execCommand('copy')}catch(e){}
  if(!ok && navigator.clipboard){navigator.clipboard.writeText(out.value).then(function(){flash('Copied')},function(){flash('Press Ctrl+C to copy');});return;}
  flash(ok ? 'Copied' : 'Press Ctrl+C to copy');
};

inp.addEventListener('input', run);
lay.addEventListener('change', run);
keyDelayInp.addEventListener('input', run);
bootDelayInp.addEventListener('input', run);
run();
</script>
</body>
</html>
